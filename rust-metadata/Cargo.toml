[package]
name = "sf-winmd-gen"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "sf-winmd-gen"

[[bin]]
name = "sf-winmd-gen"
path = "app/generate.rs"

# Keep these crates on the same release because they share metadata and RDL
# contracts.
[dependencies]
windows-clang.workspace = true
windows-default.workspace = true
windows-metadata.workspace = true
windows-rdl.workspace = true

[dev-dependencies]
windows-bindgen.workspace = true
